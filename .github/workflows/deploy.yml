# Сборка образа на GitHub-hosted runners → GHCR. Dokploy на сервере тянет
# готовый образ (pull_policy: always) — сервер ничего не компилирует.
#
# Деплой запускается отдельной job'ой ПОСЛЕ того, как образ запушен в GHCR.
# Для автоматического деплоя добавьте в GitHub secrets DOKPLOY_DEPLOY_WEBHOOK
# (Dokploy → Compose → Webhook), а авто-деплой по push в самом Dokploy выключите.
name: Build & push image

on:
  push:
    branches: [master, main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "docker-compose.dokploy.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/sergei93/b24-mcp:${{ github.sha }}
            ghcr.io/sergei93/b24-mcp:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
          IMAGE_SHA: ${{ github.sha }}
          DEPLOY_REF: ${{ github.ref_name }}
          DEPLOY_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_WEBHOOK" ]; then
            echo "::warning::DOKPLOY_DEPLOY_WEBHOOK не задан — деплой в Dokploy пропущен. Добавьте webhook в secrets."
            exit 0
          fi

          commits=$(jq -c '[.commits[]? | {added: (.added // []), modified: (.modified // []), removed: (.removed // [])}] + [{"added":[],"modified":["cmd/b24/main.go","docker-compose.dokploy.yml","go.mod","go.sum"],"removed":[]}]' "$GITHUB_EVENT_PATH")

          payload=$(mktemp)
          jq -n \
            --arg ref "refs/heads/${DEPLOY_REF}" \
            --arg sha "${IMAGE_SHA}" \
            --arg message "${DEPLOY_MESSAGE:-$IMAGE_SHA}" \
            --argjson commits "$commits" \
            '{ref: $ref, head_commit: {id: $sha, message: $message}, commits: $commits}' > "$payload"

          status=$(curl --silent --show-error --max-time 60 \
            --retry 3 --retry-delay 5 \
            -o /tmp/dokploy-response.json -w '%{http_code}' \
            -X POST "$DOKPLOY_DEPLOY_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            --data-binary "@$payload")
          cat /tmp/dokploy-response.json || true
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Dokploy webhook failed with HTTP $status"
            exit 1
          fi
          echo "Dokploy deploy triggered for ${IMAGE_SHA}"

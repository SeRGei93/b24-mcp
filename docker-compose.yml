services:
  app:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      APP_URL: ${APP_URL:?Set APP_URL to the public HTTPS URL}
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/bitrix24-mcp.sqlite}
      BITRIX_CLIENT_ID: ${BITRIX_CLIENT_ID:-}
      BITRIX_CLIENT_SECRET: ${BITRIX_CLIENT_SECRET:-}
      BITRIX_WEBHOOK_URL: ${BITRIX_WEBHOOK_URL:-}
      BITRIX_API_VERSION: ${BITRIX_API_VERSION:-auto}
      BITRIX_PORTAL_DOMAIN: ${BITRIX_PORTAL_DOMAIN:-}
      BITRIX_MCP_DEFAULT_MODE: ${BITRIX_MCP_DEFAULT_MODE:-read_only}
      BITRIX_MCP_ADMIN_TOOLS: ${BITRIX_MCP_ADMIN_TOOLS:-false}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set a random MCP_AUTH_TOKEN}
      MCP_OAUTH_REQUEST_TTL_SECONDS: ${MCP_OAUTH_REQUEST_TTL_SECONDS:-600}
      MCP_OAUTH_CODE_TTL_SECONDS: ${MCP_OAUTH_CODE_TTL_SECONDS:-300}
      MCP_OAUTH_ACCESS_TOKEN_TTL_SECONDS: ${MCP_OAUTH_ACCESS_TOKEN_TTL_SECONDS:-3600}
      MCP_OAUTH_REFRESH_TOKEN_TTL_SECONDS: ${MCP_OAUTH_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?Set a stable 32-byte base64 TOKEN_ENCRYPTION_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - sqlite_data:/app/data
    expose:
      - "3000"

volumes:
  sqlite_data:
